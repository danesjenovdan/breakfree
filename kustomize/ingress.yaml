apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: imasjajca
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.middlewares: |
      traefik-redirect-to-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - imasjajca.lb2.djnd.si
      secretName: imasjajca-tls
  rules:
    - host: imasjajca.lb2.djnd.si
      http: &http_paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: imasjajca
                port:
                  number: 80
